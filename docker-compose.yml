services:

  database:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - ./database/data:/var/lib/postgresql/data # bind mount
    expose:
      - 5432
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env (cp .env.example .env)}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -h localhost -p 5432" ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - arbodat_plus-network

  web-api:
    build: web-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres # default
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env (cp .env.example .env)}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - arbodat_plus-network

  frontend-dev:
    image: nginx
    profiles: [dev]
    volumes:
      - ./frontend:/usr/share/nginx/html # bind mount
    ports:
      - "80:80"
    depends_on:
      - web-api
    networks:
      - arbodat_plus-network

  frontend:
    build: frontend
    profiles: [prod]
    ports:
      - "80:80"
    depends_on:
      - web-api
    networks:
      - arbodat_plus-network

  proxy:
    build: proxy
    ports:
      - "3000:3000"
    networks:
      - arbodat_plus-network

networks:
  arbodat_plus-network: