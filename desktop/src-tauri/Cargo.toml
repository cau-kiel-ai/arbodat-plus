[package]
name = "arbodat-plus"
version = "5.0.0-dev"
description = "ArboDat+ desktop app: runs ArboDat+ locally (Docker) or connects to a server"
authors = ["Kiel University - Archaeoinformatics"]
license = "BSD-2-Clause"
edition = "2024"
# deploy/compose.yml is embedded from outside this crate (include_str!), so it can't be packaged.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "arbodat_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
# >= 2.11.1: fixes remote-origin windows bypassing the app-command ACL.
tauri = { version = "2.12.4", features = [] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
# Operating-system randomness for the database password.
getrandom = "0.4"
tokio = { version = "1.53", features = ["process", "time", "sync", "fs", "io-util", "net", "macros", "rt-multi-thread"] }
ts-rs = "12"
# Probing a server's /healthz (server mode). TLS with the operating system's trusted certificates
# and proxy settings, so an institute's own certificate authority works like it does in a browser.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# macOS only: the system webview never passes the mouse's back/forward buttons to the page, so
# they are picked up natively (windows/mouse_nav.rs).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent", "NSResponder", "NSWindow"] }

[dev-dependencies]
# The opener plugin matches URLs against the capability scope with this crate; we test our scope with it.
glob = "0.3"
tempfile = "3"
yaml-rust2 = "0.13"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# Deliberately NOT `panic = "abort"`: with the default unwind, a panic inside a command or a
# background task becomes an error the app can report, instead of killing the app mid-operation
# (e.g. during a backup or update).
