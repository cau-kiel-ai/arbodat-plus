#spring.application.name=ArboDat+

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Send inserts in batches (e.g. bulk create of results in the migration)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

spring.jpa.hibernate.ddl-auto=update
#checks the existing database structure when the Spring application is started
#and compares it with the entities defined in the application. If differences
#are detected, the database structure is adjusted accordingly


# Multipart file settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=250MB
spring.servlet.multipart.max-request-size=250MB

server.compression.enabled=false