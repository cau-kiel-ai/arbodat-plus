<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>ArboDat+ Export</title>

        <link href="img/favicon.png" rel="icon">
        <link href="css/input.min.css" rel="stylesheet">

        <!-- axios -->
        <script src="https://unpkg.com/axios@1.8.4/dist/axios.min.js"></script>
        <!-- bootstrap -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
        <!-- jquery -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <!-- select2 -->
        <link
            href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

        <!-- select2 style -->
        <style>
            .select2-container .select2-selection--single {
            display: flex;
            align-items: center;
            height: 52px !important;
            border: 2px solid #ccc;
            border-radius: 4px;
            }
            .select2-container .select2-selection--multiple {
            border: 2px solid #ccc;
            min-height: 52px;
            }
            .select2-container .select2-selection--single .select2-selection__rendered {
            order: 1;
            padding: 12px;
            font-size: 16px;
            color: #000000;
            }
            .select2-container .select2-selection--single .select2-selection__clear {
            order: 2;
            margin-left: auto;
            transform: translateX(50%);
            font-size: 24px;
            font-weight: 200;
            line-height: 24px;
            }
            .select2-container .select2-selection--multiple .select2-selection__clear {
            font-size: 24px;
            font-weight: 200;
            line-height: 24px;
            }
        </style>

    </head>

    <header class="header">
        <h1> <img src="img/logo_arbodat_plus.png" alt="logo_arbodat_plus"> </h1>
    </header> 

    <body>

        <!-- Accordion -->
        <div class="container-md" style="margin-top: 120px;">
            <div class="accordion" id="accordionPanels">
                
                <!-- Data Export -->
                <div class="accordion-item">

                    <h2 class="accordion-header">
                        <button
                            class="accordion-button"
                            type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#panelsStayOpen-collapseOne"
                            aria-expanded="true"
                            aria-controls="panelsStayOpen-collapseOne"
                        >
                            DATA EXPORT
                        </button>
                    </h2>

                    <div id="panelsStayOpen-collapseOne" class="accordion-collapse show">
                        <div class="accordion-body">

                            <fieldset>
                                <legend>Filter</legend>

                                <!-- research projects -->
                                <div class="row">
                                    <div class="col-25">
                                        <label for="researchProjectDropdown">research projects:</label>
                                    </div>
                                    <div class="col-75">
                                        <select id="researchProjectDropdown" multiple style="width: 100%;">
                                            <option value=""></option>
                                        </select>
                                    </div>
                                </div>

                                <!-- reference site -->
                                <div class="row">
                                    <div class="col-25">
                                        <label for="siteDropdown">sites:</label>
                                    </div>
                                    <div class="col-75">
                                        <select id="siteDropdown" multiple style="width: 100%;">
                                            <option value=""></option>
                                        </select>
                                    </div>
                                </div>

                                <!-- reference feature -->
                                <div class="row">
                                    <div class="col-25">
                                        <label for="featureDropdown">features:</label>
                                    </div>
                                    <div class="col-75">
                                        <select id="featureDropdown" multiple style="width: 100%;">
                                            <option value=""></option>
                                        </select>
                                    </div>
                                </div>

                                <!-- reference sample -->
                                <div class="row">
                                    <div class="col-25">
                                        <label for="sampleDropdown">samples:</label>
                                    </div>
                                    <div class="col-75">
                                        <select id="sampleDropdown" multiple style="width: 100%;">
                                            <option value=""></option>
                                        </select>
                                    </div>
                                </div>

                                <br>
                                <legend>Options</legend>

                                <!-- export file name -->
                                <div class="row">
                                    <div class="col-25"> 
                                        <label for="exportFileNameInput" >export file name:</label>
                                    </div>
                                    <div class="col-75">
                                        <input type="text" id="exportFileNameInput" autocomplete="off">
                                    </div>
                                </div>

                                <!-- export button -->
                                <div style="display: flex; justify-content: center; margin-top: 20px;">                
                                    <button
                                        type="button"
                                        id="exportButton"
                                        onclick="exportData()"
                                        style="
                                            padding-left: 10px; padding-right: 10px; padding-top: 2px; padding-bottom: 2px;
                                            border: 2px solid; border-radius: 4px;
                                        "
                                    >
                                        Export
                                    </button>
                                </div>

                            </fieldset>
                        </div>
                    </div>
                </div>
            </div>
        </div>


        <!--------------------------- Scripts ---------------------------->
        <script src="js/data-export/data-export.js"></script>
        <!---------------------------------------------------------------->

        <footer>
            <ul>
                <li><a href="license.html" target="_blank">License</a></li>
                <li>Version __APP_VERSION__</li>
                <li><a href="contact.html" target="_blank">Contact<strong> ☏ </strong></a></li>
            </ul>
        </footer>

    </body>
</html>
