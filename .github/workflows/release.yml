name: Release

# One git tag is the whole release process: it builds and pushes multi-arch images, smoke-tests
# them for real (anonymous pull + a running stack), builds the desktop installers, and then creates
# a DRAFT GitHub Release with the installers, the deploy/ files and SHA256SUMS. A person publishes
# the draft after testing it. See scripts/set-version.mjs for preparing a tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  meta:
    # Refuses to build if the tag doesn't match the repo
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ github.ref_name }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          node scripts/check-version.mjs "$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: frontend
            context: ./frontend
          - name: web-api
            context: ./web-api
    steps:
      - uses: actions/checkout@v7

      # Set up BuildKit to be able to build multi-platform images
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cau-kiel-ai/arbodat-plus-${{ matrix.name }}
          # floating "latest": deploy/compose.yml always requires an explicit ARBODAT_VERSION
          tags: type=raw,value=${{ needs.meta.outputs.version }}
          flavor: latest=false

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  smoke:
    # Proves the tag is actually usable: a real anonymous pull and a real running stack.
    needs: [meta, images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Pull images anonymously
        run: |
          docker logout ghcr.io || true
          docker pull ghcr.io/cau-kiel-ai/arbodat-plus-web-api:${{ needs.meta.outputs.version }}
          docker pull ghcr.io/cau-kiel-ai/arbodat-plus-frontend:${{ needs.meta.outputs.version }}

      - name: Start the stack
        working-directory: deploy
        run: |
          docker volume create arbodat-plus-database
          {
            echo "ARBODAT_VERSION=${{ needs.meta.outputs.version }}"
            echo "DATABASE_PASSWORD=release-smoke-test"
          } > .env
          docker compose up -d --wait --wait-timeout 300

      - name: Check it actually answers requests
        run: |
          set -euo pipefail
          # Wait for web-api to finish startup
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8480/api/results?page=0&size=1')
            [ "$code" = 200 ] && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8480/healthz
          curl -fsS http://127.0.0.1:8480/version.json | grep -q "${{ needs.meta.outputs.version }}"
          curl -fsS 'http://127.0.0.1:8480/api/results?page=0&size=1' | grep -q '"content"'

      - name: Show logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs

      - name: Tear down
        if: always()
        working-directory: deploy
        run: |
          docker compose down || true
          docker volume rm arbodat-plus-database || true

  desktop:
    # Unsigned installers for macOS and Windows. They don't need the images, so they build in
    # parallel with them; nothing is published unless every job is green (see release).
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # One app for Apple silicon and Intel; dmg only (a bare .app is a folder).
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            # NSIS only: WiX/MSI rejects pre-release versions like 5.0.0-rc.1.
            args: --bundles nsis
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm tauri build ${{ matrix.args }}
        working-directory: desktop
      - name: Collect the installers
        shell: bash
        run: bash scripts/collect-installers.sh "${{ needs.meta.outputs.version }}" installers
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: installers/
          if-no-files-found: error

  desktop-linux:
    # .deb and AppImage for x64 and arm64, built in an Ubuntu 22.04 container: the installers link
    # against the glibc they were built with (2.35 here), so they also run on distributions older
    # than the runner's.
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    container: ubuntu:22.04
    env:
      # The AppImage tools are AppImages themselves, and a container has no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Build tools and Tauri's Linux libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential curl wget file ca-certificates pkg-config git xdg-utils \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm tauri build --bundles deb,appimage
        working-directory: desktop
      - name: Collect the installers
        run: bash scripts/collect-installers.sh "${{ needs.meta.outputs.version }}" installers
      - uses: actions/upload-artifact@v7
        with:
          name: installers-linux-${{ runner.arch }}
          path: installers/
          if-no-files-found: error

  release:
    needs: [meta, smoke, desktop, desktop-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: assets
          merge-multiple: true
      - name: Add the server files and checksums
        run: |
          cp deploy/compose.yml deploy/README.md assets/
          # GitHub renames asset names that start with a dot, so name it plainly.
          cp deploy/.env.example assets/env.example
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "$TAG" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" assets/*
